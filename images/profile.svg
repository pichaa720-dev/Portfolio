<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="450" fill="url(#bgGrad)" />

  <!-- Tech Geometric Ornaments -->
  <circle cx="200" cy="190" r="145" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="340" cy="80" r="40" fill="#6366f1" opacity="0.1" />
  <circle cx="70" cy="360" r="60" fill="#06b6d4" opacity="0.1" />

  <!-- Body / Suit -->
  <path d="M70 450 C70 340, 120 310, 200 310 C280 310, 330 340, 330 450 Z" fill="url(#suitGrad)" />
  <path d="M150 450 L200 340 L250 450 Z" fill="url(#shirtGrad)" />
  <path d="M192 345 L208 345 L212 450 L188 450 Z" fill="#6366f1" />
  
  <!-- Suit Collars -->
  <path d="M140 325 L200 410 L165 450 L115 350 Z" fill="#334155" />
  <path d="M260 325 L200 410 L235 450 L285 350 Z" fill="#334155" />

  <!-- Neck -->
  <rect x="175" y="240" width="50" height="60" rx="8" fill="url(#skinGrad)" />
  <path d="M175 270 Q200 290 225 270 L225 285 Q200 305 175 285 Z" fill="#f97316" opacity="0.15" />

  <!-- Head -->
  <ellipse cx="200" cy="195" rx="60" ry="72" fill="url(#skinGrad)" />

  <!-- Hair -->
  <path d="M136 175 C132 120, 160 100, 200 100 C245 100, 268 120, 264 175 C250 145, 230 135, 200 135 C170 135, 150 145, 136 175 Z" fill="#1e1b4b" />
  <path d="M136 175 Q130 200 138 215 Q145 190 145 170 Z" fill="#1e1b4b" />
  <path d="M264 175 Q270 200 262 215 Q255 190 255 170 Z" fill="#1e1b4b" />

  <!-- Ears -->
  <circle cx="138" cy="195" r="12" fill="url(#skinGrad)" />
  <circle cx="262" cy="195" r="12" fill="url(#skinGrad)" />

  <!-- Glasses (Modern Tech Look) -->
  <rect x="150" y="180" width="38" height="26" rx="6" fill="none" stroke="#0f172a" stroke-width="3" />
  <rect x="212" y="180" width="38" height="26" rx="6" fill="none" stroke="#0f172a" stroke-width="3" />
  <line x1="188" y1="193" x2="212" y2="193" stroke="#0f172a" stroke-width="3" />
  <line x1="140" y1="188" x2="150" y2="188" stroke="#0f172a" stroke-width="3" />
  <line x1="250" y1="188" x2="260" y2="188" stroke="#0f172a" stroke-width="3" />
  <!-- Lens reflection -->
  <line x1="155" y1="185" x2="175" y2="185" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <line x1="217" y1="185" x2="237" y2="185" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Eyes -->
  <circle cx="169" cy="193" r="4.5" fill="#0f172a" />
  <circle cx="231" cy="193" r="4.5" fill="#0f172a" />
  <circle cx="171" cy="191" r="1.5" fill="#ffffff" />
  <circle cx="233" cy="191" r="1.5" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M152 173 Q169 168 184 173" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <path d="M216 173 Q231 168 248 173" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M200 195 L196 215 L204 215" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4" />

  <!-- Smile -->
  <path d="M185 233 Q200 246 215 233" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Tech code badge icon at bottom right -->
  <g transform="translate(305, 370)">
    <circle cx="20" cy="20" r="24" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
    <text x="20" y="26" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>

